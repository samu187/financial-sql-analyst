[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analyst-langgraph"
version = "0.1.0"
description = "A LangGraph-powered financial statement analyst using SQLite and OpenAI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel" }
]
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
start = "app.main:start"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["app"]
