[project]
name = "financial-analyst"
version = "0.1.0"
description = "A CLI financial analyst with a US stock resolution graph."
readme = "README.md"
authors = [
    { name = "samu187", email = "samuel-alciati@live.it" }
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "openai>=2.0,<3",
    "pydantic>=2.0,<3",
    "typer>=0.16,<1",
    "rich>=13,<16",
    "sqlparse>=0.5,<1",
    "platformdirs>=4,<5",
    "yfinance>=0.2.65,<2",
]

[project.scripts]
financial-analyst = "analyst.cli:main"
fin = "analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
